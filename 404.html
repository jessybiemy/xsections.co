<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wrong exit · Xsections</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b1e">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .lost { position: relative; z-index: 2; min-height: 100vh; display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .lost .glass { display: grid; gap: 16px; justify-items: start; max-width: 520px; padding: 32px; border-radius: 26px; }
  .lost img { width: 72px; height: 72px; }
  .lost h1 { font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -0.04em; }
  .lost p { color: var(--ink-2); }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>
<div class="grain" aria-hidden="true"></div>
<main class="lost">
  <div class="glass">
    <img src="/img/brand/x-night-256.png" width="72" height="72" alt="Xsections">
    <p class="eyebrow">404</p>
    <h1 lang="en">Wrong exit.</h1>
    <p lang="en">This road does not go anywhere. Take the roundabout again.</p>
    <p lang="fr">Mauvaise sortie : cette route ne mène nulle part. Refais un tour de giratoire.</p>
    <a class="btn primary" href="/">Back to the junction · Retour au carrefour</a>
  </div>
</main>
</body>
</html>
