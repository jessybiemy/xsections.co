<style>
@font-face { font-family: 'Lexend'; font-style: normal; font-weight: 300 700; font-display: swap; src: url(/fonts/lexend-latin-normal.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/figtree-latin-normal.woff2) format('woff2'); }

/* Layout: one screen. Words and the call box on the left, the official X at full height on the
   right: the X is the junction the headline talks about. Night only (the social DA), flat fields,
   no lines, no shadows, no gradients. Round shapes, like the arms of the X. */
:root {
  color-scheme: dark;
  --ground: #080d22;      /* night of the brand */
  --ground-2: #121a3b;    /* one tone step: the call box */
  --ground-3: #222c55;    /* resting ring of the push button */
  --ink: #eef1f8;
  --ink-2: #b7bfd8;       /* secondary notes only */
  --signal: #ffb21e;      /* French traffic-signal amber: the action and the lamp */
  --signal-hi: #ffc552;
  --signal-off: #3a3324;  /* the same lens, unlit */
  --on-signal: #0b1130;
  --f-head: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --t-lead: clamp(19px, 1.55vw, 23px);
  --t-body: 17px;
  --t-small: 15px;
  --gut: clamp(16px, 3.4vw, 48px);
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { background: var(--ground); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--t-body)/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 6px; }
.page {
  min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
  max-width: 1600px; margin-inline: auto;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.lockup { --w: 30px; display: inline-flex; align-items: center; text-decoration: none; color: var(--ink); }
.lockup img { width: calc(var(--w) * 1.16); height: calc(var(--w) * 1.16); flex: none; }
.lockup span { font: 500 var(--w)/.9 var(--f-head); letter-spacing: -.05em; margin-left: .06em; padding-bottom: .08em; white-space: nowrap; }
.lang { font: 500 var(--t-body)/1 var(--f-body); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; padding: 10px 2px; }
.lang:hover { color: var(--signal-hi); }

.hero {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: center;
  column-gap: clamp(24px, 4vw, 72px); padding-block: clamp(16px, 3vh, 48px);
}
.copy { display: grid; justify-items: start; min-width: 0; container-type: inline-size; }
h1 {
  margin: 0; font: 500 clamp(42px, 15.6cqi, 124px)/.98 var(--f-head); letter-spacing: -.035em;
  text-wrap: balance;
}
.lead { margin: 28px 0 0; font-size: var(--t-lead); line-height: 1.45; max-width: 34ch; }

.callbox {
  margin-top: 40px; width: min(100%, 540px);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 18px;
  padding: 12px 12px 12px 22px; background: var(--ground-2); border-radius: 30px;
}
.lamp { width: 22px; height: 22px; border-radius: 50%; background: var(--signal); animation: blink 1s steps(1, end) infinite; }
@keyframes blink { 50% { background: var(--signal-off); } }
.status { margin: 0; min-width: 0; }
.status strong { display: block; font-weight: 650; }
.status span { display: block; color: var(--ink-2); font-size: var(--t-small); }
.push {
  width: 84px; height: 84px; border-radius: 50%; cursor: pointer; padding: 0;
  border: 7px solid var(--ground-3); background: var(--ink) padding-box; /* the border is the lit ring */
  color: var(--on-signal); font: 650 14px/1 var(--f-body); display: grid; place-items: center;
  transition: transform .18s var(--ease), background-color .2s ease, border-color .25s ease;
}
.push:hover { background-color: #ffffff; }
.push:active { transform: scale(.93); }
.push:focus-visible { outline-offset: 4px; border-radius: 50%; }
.callbox[data-state="done"] .push, .callbox[data-state="back"] .push { border-color: var(--signal); }
.callbox.pulse .status { animation: nudge .45s var(--ease); }
@keyframes nudge { from { transform: translateX(-8px); opacity: .4; } }

.act { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
.btn {
  display: inline-flex; align-items: center; min-height: 56px; padding: 0 30px; border-radius: 999px;
  background: var(--signal); color: var(--on-signal); text-decoration: none; font: 650 18px/1 var(--f-body);
  transition: background-color .2s ease, transform .18s var(--ease);
}
.btn:hover { background: var(--signal-hi); }
.btn:active { transform: scale(.97); }
.follow { margin: 0; color: var(--ink-2); font-size: var(--t-small); max-width: 30ch; text-wrap: balance; }
.follow a { color: var(--ink); text-underline-offset: 4px; }
.follow a:hover { color: var(--signal-hi); }

.mark { margin: 0; justify-self: end; width: 100%; max-width: min(100%, 70svh, 700px); }
.mark img { display: block; width: 100%; height: auto; }

.foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  padding-block: 24px 28px; color: var(--ink-2); font-size: var(--t-small);
}
.foot p { margin: 0; }
.foot a { color: var(--ink-2); text-underline-offset: 4px; }
.foot a:hover { color: var(--ink); }

@media (max-width: 699px) {
  .hero { grid-template-columns: minmax(0, 1fr); align-content: start; padding-block: 8px 24px; }
  .mark { order: -1; justify-self: start; max-width: min(64vw, 340px); margin-bottom: 28px; }
  .lead { margin-top: 20px; }
  .callbox { margin-top: 32px; }
}
@media (max-width: 479px) {
  .callbox { gap: 14px; padding-left: 18px; }
  .push { width: 76px; height: 76px; border-width: 6px; font-size: 13px; }
  .act { gap: 16px; }
  .btn { width: 100%; justify-content: center; }
}

/* entrance: each part rises once, in reading order; nothing waits on script */
@media (prefers-reduced-motion: no-preference) {
  .bar, h1, .lead, .callbox, .act, .foot { animation: rise .8s var(--ease) both; }
  h1 { animation-delay: .06s; } .lead { animation-delay: .14s; } .callbox { animation-delay: .22s; }
  .act { animation-delay: .3s; } .foot { animation-delay: .38s; }
  .mark img { animation: settle 1.2s var(--ease) .1s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
  @keyframes settle { from { opacity: 0; transform: scale(.94) rotate(-6deg); } }
}
@media (prefers-reduced-motion: reduce) {
  .lamp { animation: none; }
}

.nf main { align-self: center; padding-block: 48px; }
.nf h1 { margin: 0 0 20px; max-width: none; }
.nf p { margin: 0 0 10px; font-size: 19px; }
.nf .nf-fr { color: var(--ink-2); }
.nf a { text-underline-offset: 4px; }

</style>
</head>
<body>
<div class="page nf">
  <header class="bar"></header>
  <main>
    <h1>Wrong exit.</h1>
    <p>This road goes nowhere yet. <a href="/">Back to the junction</a></p>
    <p class="nf-fr" lang="fr"><strong>Mauvaise sortie.</strong> Cette route ne mène nulle part, pour l’instant. <a href="/fr/">Retour au carrefour</a></p>
  </main>
  <footer class="foot"><p>© 2026 Ivoria Interactive</p></footer>
</div>
</body>
